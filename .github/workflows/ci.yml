name: CI

on:
  push:
    branches: [main, v2-dev, design-v2, features-v3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (SQLite)
        run: go test -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/opengate ./cmd/opengate

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opengate
          POSTGRES_PASSWORD: opengate   # CI-only throwaway database
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opengate" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (PostgreSQL)
        env:
          OPENGATE_TEST_POSTGRES_DSN: postgres://opengate:opengate@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./internal/store/ ./internal/budget/ ./integration/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opengate:ci
          build-args: VERSION=${{ github.sha }}
          load: true
      - name: smoke test
        run: |
          docker run -d --name og -p 8080:8080 \
            -e OPENGATE_ADMIN_TOKEN=ci-admin-token-0123456789 \
            -e OPENGATE_MASTER_KEY="$(docker run --rm opengate:ci keygen | sed -n 's/^OPENGATE_MASTER_KEY=//p')" \
            opengate:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker logs og
          docker rm -f og
