# Production OpenGate. Separate from the public demo (deploy/fly-demo, app
# "opengate"). This file does not deploy anything and does not touch DNS.
# From the repo root, after you create the app and secrets (docs/LAUNCH.md):
#   fly deploy -c deploy/fly-prod/fly.toml
#
# App name is a placeholder. Create it yourself; do not reuse the demo app
# or the demo volume (opengate_data).
app = "opengate-prod"
primary_region = "yul"

[build]
  dockerfile = "../../Dockerfile.prod"

[experimental]
  cmd = ["serve", "-config", "/etc/opengate/cloud.yaml"]

[[files]]
  guest_path = "/etc/opengate/cloud.yaml"
  local_path = "deploy/cloud.yaml"

[env]
  OPENGATE_ENV = "production"
  OPENGATE_LISTEN = "0.0.0.0:8080"
  OPENGATE_LOG_FORMAT = "json"
  # Placeholder until the hostname is confirmed. Override with a secret if needed.
  OPENGATE_PUBLIC_URL = "https://opengatehq.com"
  # Database is a secret, not this file:
  #   Postgres (preferred): OPENGATE_DATABASE=postgres://...
  #   SQLite + Litestream: OPENGATE_DATABASE=/data/opengate.db
  #     plus LITESTREAM_BUCKET, LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY
  # Demo flags are refused while OPENGATE_ENV=production. Do not set
  # OPENGATE_DEMO_MOCK_LISTEN, OPENGATE_DEMO_TRAFFIC, or OPENGATE_PUBLIC_PLAYGROUND.

# SQLite only. Create a new volume on this app. Never mount the demo volume.
#   fly volumes create opengate_prod_data --size 10 -a opengate-prod
# [[mounts]]
#   source = "opengate_prod_data"
#   destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "3s"
  path = "/livez"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
