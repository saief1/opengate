# OpenGate Cloud demo: cloud mode against the local mock Stripe and mock
# provider. No real Stripe account, card or provider key is involved.
#   make cloud-demo
listen: 127.0.0.1:8080
database: cloud-demo.db
providers:
  openai:     {base_url: "http://127.0.0.1:9090/openai/v1"}
  anthropic:  {base_url: "http://127.0.0.1:9090/anthropic"}
  gemini:     {base_url: "http://127.0.0.1:9090/gemini"}
  openrouter: {base_url: "http://127.0.0.1:9090/openrouter/v1"}
cloud:
  enabled: true
  public_url: http://127.0.0.1:8080
  sales_url: "mailto:sales@example.com"
  stripe:
    base_url: http://127.0.0.1:12111   # `opengate mock-stripe`
  plans:
    - id: free
      name: Free
      max_requests_month: 50          # tiny so the demo hits the quota
      max_members: 3
      max_projects: 2
      log_retention_days: 7
      features: ["50 requests / month (demo)", "3 team members", "2 projects", "7-day request logs"]
    - id: team
      name: Team
      price_usd: 49
      interval: month
      stripe_price_id: price_demo_team
      max_requests_month: 1000000
      max_members: 25
      log_retention_days: 30
      features: ["1M requests / month", "25 team members", "Unlimited projects", "30-day request logs", "Email support"]
    - id: enterprise
      name: Enterprise
      contact_sales: true
      log_retention_days: 365
      features: ["Unlimited requests", "SSO & custom contracts", "1-year request logs", "Priority support"]
