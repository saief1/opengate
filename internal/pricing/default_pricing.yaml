# OpenGate price table. Prices are USD per 1,000,000 tokens (standard /
# on-demand tier, global endpoints, no batch/flex/priority discounts).
#
# Keys are "provider/model" where provider is the OpenGate provider name and
# model is the upstream model id. A trailing "*" makes an entry a prefix match
# (longest prefix wins). Unknown models are charged at the `default` rate so
# that budgets still apply when a new model appears before this file is updated.
#
# Fields:
#   input / output   regular input and output tokens
#   cache_read       prompt tokens served from the provider's prompt cache
#                    (OpenAI "cached input", Anthropic "cache hits & refreshes",
#                    Gemini "context caching"). Defaults to `input`.
#   cache_write      prompt tokens written to the cache (Anthropic 5-minute
#                    cache writes = 1.25x input; OpenAI cache writes on GPT-5.6+/6).
#                    Defaults to `input`.
#   long_context     {threshold, input, output, cache_read, cache_write}: used
#                    instead when the prompt has more than `threshold` tokens.
#
# ---------------------------------------------------------------------------
# Refreshed 2026-10-09 against the official pricing pages:
#   OpenAI     https://platform.openai.com/docs/pricing            (fetched 2026-10-09)
#   Anthropic  https://docs.anthropic.com/en/docs/about-claude/pricing (fetched 2026-10-09)
#   Google     https://ai.google.dev/gemini-api/docs/pricing       (page "last updated 2026-10-09 UTC")
#   OpenRouter passes through upstream list prices; see https://openrouter.ai/models
# Notes at time of refresh:
#   * OpenAI GPT-5.6 Sol is promotional pricing "at least through 2026-11-21".
#   * Gemini 3.6/3.7/3.8 Flash prices are introductory through 2026-12-31 and
#     DOUBLE on 2027-01-01 (e.g. 3.8 Flash $0.75 -> $1.50 input). Update then.
#   * Anthropic model ids for the 5.x generation are matched by prefix; check
#     the exact ids on https://docs.anthropic.com/en/docs/about-claude/models.
#   * Data-residency / regional endpoints (+10%) and 1h Anthropic cache writes
#     (2x input) are not modelled; adjust if you use them.
# Verify against the pages above before relying on these numbers for billing.
# Dump an editable copy with `opengate pricing > pricing.yaml` and point
# `pricing_file` (or OPENGATE_PRICING_FILE) at it. Reload without restarting
# via SIGHUP or POST /admin/api/pricing/reload.
# ---------------------------------------------------------------------------

