# OpenGate price table. Prices are USD per 1,000,000 tokens.
#
# Keys are "provider/model" where provider is the OpenGate provider name and
# model is the upstream model id. A trailing "*" makes an entry a prefix match
# (longest prefix wins). Unknown models are charged at the `default` rate so
# that budgets still apply when a new model appears before this file is updated.
#
# These numbers are a starting point: verify them against your providers'
# current price pages. Dump an editable copy with `opengate pricing > pricing.yaml`
# and point `pricing_file` (or OPENGATE_PRICING_FILE) at it. Reload without
# restarting via SIGHUP or POST /admin/api/pricing/reload.

default: {input: 5.00, output: 15.00}

models:
  # OpenAI
  openai/gpt-5:             {input: 1.25, output: 10.00}
  openai/gpt-5-mini:        {input: 0.25, output: 2.00}
  openai/gpt-5-nano:        {input: 0.05, output: 0.40}
  openai/gpt-4.1:           {input: 2.00, output: 8.00}
  openai/gpt-4.1-mini:      {input: 0.40, output: 1.60}
  openai/gpt-4.1-nano:      {input: 0.10, output: 0.40}
  openai/gpt-4o:            {input: 2.50, output: 10.00}
  openai/gpt-4o-mini:       {input: 0.15, output: 0.60}
  openai/o3:                {input: 2.00, output: 8.00}
  openai/o4-mini:           {input: 1.10, output: 4.40}

  # Anthropic
  anthropic/claude-opus-4*:      {input: 15.00, output: 75.00}
  anthropic/claude-sonnet-4*:    {input: 3.00, output: 15.00}
  anthropic/claude-haiku-4*:     {input: 1.00, output: 5.00}
  anthropic/claude-3-5-haiku*:   {input: 0.80, output: 4.00}

  # Google Gemini
  gemini/gemini-2.5-pro*:        {input: 1.25, output: 10.00}
  gemini/gemini-2.5-flash-lite*: {input: 0.10, output: 0.40}
  gemini/gemini-2.5-flash*:      {input: 0.30, output: 2.50}
  gemini/gemini-2.0-flash*:      {input: 0.10, output: 0.40}

  # OpenRouter (model ids are "vendor/model")
  openrouter/openai/gpt-4o:            {input: 2.50, output: 10.00}
  openrouter/openai/gpt-4o-mini:       {input: 0.15, output: 0.60}
  openrouter/anthropic/claude-sonnet-4*: {input: 3.00, output: 15.00}
  openrouter/meta-llama/*:             {input: 0.20, output: 0.60}
