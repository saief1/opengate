              type: "object"
              properties:
                email:
                  type: "string"
                role:
                  type: "string"
              required:
                - "email"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  invite:
                    $ref: "#/components/schemas/Invite"
                  token:
                    type: "string"
                  url:
                    type: "string"
        "400":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found (also for other orgs' IDs)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/admin/api/invites/{id}":
    delete:
      tags:
        - "Team"
      summary: "Revoke an invite"
      operationId: "delete_invites_id"
      x-min-role: "admin"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found (also for other orgs' IDs)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/api/settings:
    get:
      tags:
        - "Team"
      summary: "Instance and org settings (read-only view)"
      operationId: "get_settings"
      x-min-role: "viewer"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found (also for other orgs' IDs)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    adminToken:
      type: "http"
      scheme: "bearer"
      description: "OPENGATE_ADMIN_TOKEN; pick the org with X-OpenGate-Org"
    session:
      type: "apiKey"
      in: "cookie"
      name: "og_session"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            message:
              type: "string"
            type:
              type: "string"
            code:
              type: "string"
            param:
              type: "string"
              nullable: true
    ModelPolicy:
      type: "object"
      properties:
        allowed_models:
          type: "array"
          items:
            type: "string"
        denied_models:
          type: "array"
          items:
            type: "string"
        max_tokens:
          type: "integer"
    Project:
      type: "object"
      properties:
        id:
          type: "string"
        org_id:
          type: "string"
        name:
          type: "string"
        log_bodies:
          type: "boolean"
        killed:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
        allowed_models:
          type: "array"
          items:
            type: "string"
        denied_models:
          type: "array"
          items:
            type: "string"
        max_tokens:
          type: "integer"
        cache_ttl_seconds:
          type: "integer"
        allowed_features:
          type: "array"
          items:
            type: "string"
            enum:
              - "background"
              - "n"
              - "builtin_tools"
              - "store"
        trust_customer_header:
          type: "boolean"
        guardrails:
          $ref: "#/components/schemas/Guardrails"
    ProjectPatch:
      type: "object"
      properties:
        log_bodies:
          type: "boolean"
        cache_ttl_seconds:
          type: "integer"
        allowed_models:
          type: "array"
          items:
            type: "string"
        denied_models:
          type: "array"
          items:
            type: "string"
        max_tokens:
          type: "integer"
        allowed_features:
          type: "array"
          items:
            type: "string"
        trust_customer_header:
          type: "boolean"
    VirtualKey:
      type: "object"
      properties:
        id:
          type: "string"
        project_id:
          type: "string"
        name:
          type: "string"
        agent:
          type: "string"
        user:
          type: "string"
        prefix:
          type: "string"
        killed:
          type: "boolean"
        revoked:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
        allowed_models:
          type: "array"
          items:
            type: "string"
        denied_models:
          type: "array"
          items:
            type: "string"
        max_tokens:
          type: "integer"
        customer_id:
          type: "string"
    KeyCreate:
      type: "object"
      properties:
        project_id:
          type: "string"
        name:
          type: "string"
        agent:
          type: "string"
        user:
          type: "string"
        limits:
          $ref: "#/components/schemas/LimitValues"
    KeyCreated:
      type: "object"
      properties:
        key:
          type: "string"
          description: "Plaintext og-... key, shown once"
        virtual_key:
          $ref: "#/components/schemas/VirtualKey"
    KeyPatch:
      type: "object"
      properties:
        allowed_models:
          type: "array"
          items:
            type: "string"
        denied_models:
          type: "array"
          items:
            type: "string"
        max_tokens:
          type: "integer"
        customer_id:
          type: "string"
    LimitValues:
      type: "object"
      properties:
        daily_usd:
          type: "number"
        monthly_usd:
          type: "number"
        total_usd:
          type: "number"
        rpm:
          type: "integer"
    Limit:
      type: "object"
      properties:
        scope:
          type: "string"
          enum:
            - "key"
            - "agent"
            - "project"
          description: "org caps are managed via /org/spend-cap"
        scope_id:
          type: "string"
        daily_usd:
          type: "number"
        monthly_usd:
          type: "number"
        total_usd:
          type: "number"
        rpm:
          type: "integer"
      required:
        - "scope"
        - "scope_id"
    RequestLog:
      type: "object"
      properties:
        id:
          type: "string"
        ts:
          type: "string"
          format: "date-time"
        endpoint:
          type: "string"
        project_id:
          type: "string"
        key_id:
          type: "string"
        agent:
          type: "string"
        model:
          type: "string"
        provider:
          type: "string"
        provider_model:
          type: "string"
        status:
          type: "integer"
        prompt_tokens:
          type: "integer"
        completion_tokens:
          type: "integer"
        cached_tokens:
          type: "integer"
        cost_usd:
          type: "number"
        billed_usd:
          type: "number"
        latency_ms:
          type: "integer"
        stream:
          type: "boolean"
        customer_id:
          type: "string"
        guard:
          type: "string"
        guard_action:
          type: "string"
        cache_hit:
          type: "boolean"
        usage_estimated:
          type: "boolean"
        error:
          type: "string"
        attempts:
          type: "integer"
        hops:
          type: "array"
          description: "Every upstream attempt in order (detail endpoint only)"
          items:
            $ref: "#/components/schemas/Hop"
        request_body:
          type: "string"
          description: "Only when the project logs bodies"
        response_body:
          type: "string"
    Hop:
      type: "object"
      properties:
        provider:
          type: "string"
        model:
          type: "string"
        status:
          type: "integer"
          description: "Provider HTTP status; 0 = no response"
        latency_ms:
          type: "integer"
        error:
          type: "string"
        started_at:
          type: "string"
          format: "date-time"
    KillSwitch:
      type: "object"
      properties:
        scope:
          type: "string"
          enum:
            - "global"
            - "agent"
            - "customer"
        scope_id:
          type: "string"
        killed_at:
          type: "string"
          format: "date-time"
        actor:
          type: "string"
    OrgSpendCap:
      type: "object"
      properties:
        daily_usd:
          type: "number"
        monthly_usd:
          type: "number"
        source:
          type: "string"
          enum:
            - "org"
            - "config"
            - ""
          description: "org = set via API, config = server default, empty = no org cap"
        daily_spent:
          type: "number"
        monthly_spent:
          type: "number"
        project_caps:
          type: "object"
          properties:
            daily_usd:
              type: "number"
            monthly_usd:
              type: "number"
    ProviderKey:
      type: "object"
      properties:
        id:
          type: "string"
        provider:
          type: "string"
        label:
          type: "string"
        hint:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
    RoutingRule:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        priority:
          type: "integer"
        enabled:
          type: "boolean"
        project_id:
          type: "string"
        match:
          type: "object"
          properties:
            models:
              type: "array"
              items:
                type: "string"
            min_prompt_tokens:
              type: "integer"
            max_prompt_tokens:
              type: "integer"
            tags:
              type: "array"
              items:
                type: "string"
            headers:
              type: "object"
              additionalProperties:
                type: "string"
            agent:
              type: "string"
            max_cost_usd:
              type: "number"
        target:
          type: "string"
          description: "provider/model, an alias, or auto"
        fallbacks:
          type: "array"
          items:
            type: "string"
    Guardrails:
      type: "object"
      properties:
        pii:
          type: "string"
          enum:
            - "off"
            - "log"
            - "redact"
            - "block"
        categories:
          type: "array"
          items:
            type: "string"
        responses:
          type: "boolean"
        injection:
          type: "string"
          enum:
            - "off"
            - "log"
            - "block"
    Customer:
      type: "object"
      properties:
        project_id:
          type: "string"
        customer_id:
          type: "string"
        name:
          type: "string"
        stripe_customer_id:
          type: "string"
        requests:
          type: "integer"
        prompt_tokens:
          type: "integer"
        completion_tokens:
          type: "integer"
        cost_usd:
          type: "number"
        billed_usd:
          type: "number"
    Markup:
      type: "object"
      properties:
        id:
          type: "string"
        project_id:
          type: "string"
        customer_id:
          type: "string"
        model:
          type: "string"
        markup_pct:
          type: "number"
        per_mtok_usd:
          type: "number"
          description: "Flat USD fee per million tokens, added to the percentage markup"
    Org:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        role:
          type: "string"
    Member:
      type: "object"
      properties:
        id:
          type: "string"
        email:
          type: "string"
        name:
          type: "string"
        role:
          type: "string"
          enum:
            - "owner"
            - "admin"
            - "member"
            - "viewer"
          description: "viewer = read-only (\"read-only\" is accepted as an alias)"
        joined_at:
          type: "string"
          format: "date-time"
    Invite:
      type: "object"
      properties:
        id:
          type: "string"
        email:
          type: "string"
        role:
          type: "string"
        expires_at:
          type: "string"
          format: "date-time"
    AuditEntry:
      type: "object"
      properties:
        id:
          type: "string"
        ts:
          type: "string"
          format: "date-time"
        actor:
          type: "string"
        action:
          type: "string"
        target:
          type: "string"
        ip:
          type: "string"
        actor_type:
          type: "string"
        actor_email:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "object"
        before:
          type: "object"
          description: "State before the change"
        after:
          type: "object"
          description: "State after the change"
    MCPServer:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        url:
          type: "string"
        transport:
          type: "string"
          enum:
            - "http"
            - "sse"
        auth_header:
          type: "string"
        has_secret:
          type: "boolean"
        secret_hint:
          type: "string"
        default_rpm:
          type: "integer"
        enabled:
          type: "boolean"
        gateway_path:
          type: "string"
    MCPServerInput:
      type: "object"
      properties:
        name:
          type: "string"
        url:
          type: "string"
        transport:
          type: "string"
        auth_header:
          type: "string"
        secret:
          type: "string"
          description: "Write-only upstream secret (stored encrypted, never returned)"
        default_rpm:
          type: "integer"
        enabled:
          type: "boolean"
        clear_secret:
          type: "boolean"
    MCPCredential:
      type: "object"
      properties:
        id:
          type: "string"
        server_id:
          type: "string"
        agent:
          type: "string"
        header:
          type: "string"
        secret_hint:
          type: "string"
    MCPPolicy:
      type: "object"
      properties:
        id:
          type: "string"
        server_id:
          type: "string"
        agent:
          type: "string"
          description: "empty = every agent"
        tool:
          type: "string"
          description: "exact name or prefix*"
        action:
          type: "string"
          enum:
            - "allow"
            - "deny"
        rpm:
          type: "integer"
      required:
        - "server_id"
        - "tool"
        - "action"
    MCPCall:
      type: "object"
      properties:
        id:
          type: "string"
        ts:
          type: "string"
          format: "date-time"
        agent:
          type: "string"
        key_id:
          type: "string"
        server_name:
          type: "string"
        method:
          type: "string"
        tool:
          type: "string"
        args:
          type: "string"
          description: "Redacted, truncated JSON arguments"
        redacted:
          type: "boolean"
        status:
          type: "integer"
        error_code:
          type: "string"
        latency_ms:
          type: "integer"
    Me:
      type: "object"
      properties:
        kind:
          type: "string"
          enum:
            - "token"
            - "session"
        user:
          type: "object"
          properties:
            id:
              type: "string"
            email:
              type: "string"
            name:
              type: "string"
        org_id:
          type: "string"
        role:
          type: "string"
        orgs:
          type: "array"
          items:
            $ref: "#/components/schemas/Org"
