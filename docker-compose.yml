# Quick start:
#   cp examples/env.example .env && docker run --rm opengate keygen >> .env   (or: go run ./cmd/opengate keygen >> .env)
#   docker compose up -d
#   open http://localhost:8080/ui/
#
# The optional "mock" service lets you try everything without real provider
# keys: `docker compose --profile demo up -d` with these lines in .env:
#   OPENGATE_PROVIDER_OPENAI_BASE_URL=http://mock:9090/openai/v1
#   OPENGATE_PROVIDER_ANTHROPIC_BASE_URL=http://mock:9090/anthropic
#   OPENGATE_PROVIDER_GEMINI_BASE_URL=http://mock:9090/gemini
#   OPENGATE_PROVIDER_OPENROUTER_BASE_URL=http://mock:9090/openrouter/v1
#   OPENGATE_ALLOW_INSECURE_UPSTREAM=true   # plain http to the mock container (never for real providers)
services:
  opengate:
    build: .
    image: opengate:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind to localhost; put a TLS proxy in front for remote access
    env_file: .env
    environment:
      OPENGATE_CONFIG: /etc/opengate/opengate.yaml
    volumes:
      - opengate-data:/data
      - ./examples/opengate.example.yaml:/etc/opengate/opengate.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mock:
    profiles: ["demo"]
    image: opengate:latest
    command: ["mock-provider", "-listen", "0.0.0.0:9090"]
    read_only: true
    cap_drop: [ALL]

volumes:
  opengate-data:
